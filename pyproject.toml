[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "box-checker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23,<1",
    "tree-sitter-go>=0.23,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
